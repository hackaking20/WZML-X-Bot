name: Amaterasu bot (harness)

# Runs Amaterasu on a throwaway GitHub Actions runner, inside a daytime window
# only: 06:00–21:00 IST (00:30–15:30 UTC).
#
# Runs chain into each other: when one finishes, the last step dispatches the
# next, so the bot is continuous inside the window and stops at the boundary.
# The chain needs a PAT_TOKEN secret — a workflow dispatched with the built-in
# GITHUB_TOKEN does not start another run. Without it, only the cron fires.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Run length in minutes (max 330)'
        required: false
        default: '285'
      force:
        description: 'Ignore the 06:00-21:00 IST window (true/false)'
        required: false
        default: 'false'
  schedule:
    # 06:00 IST — start the day.
    - cron: '30 0 * * *'
    # 13:00 IST — restart if the chain broke overnight or a run died early.
    - cron: '30 7 * * *'

concurrency:
  group: amaterasu-runner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bot:
    name: Run Amaterasu
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout harness repo
        uses: actions/checkout@v4

      - name: Time window (06:00-21:00 IST)
        id: window
        run: |
          MIN=$(( ( $(date -u +%s) + 19800 ) % 86400 / 60 ))
          IST=$(TZ=Asia/Kolkata date '+%H:%M')
          echo "IST now: $IST (minute-of-day $MIN)"
          if [ "$MIN" -ge 360 ] && [ "$MIN" -lt 1260 ]; then
            echo "inside=1" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "::warning::outside the window but force=true — starting anyway"
            echo "inside=1" >> "$GITHUB_OUTPUT"
          else
            echo "inside=0" >> "$GITHUB_OUTPUT"
            echo "::notice::outside 06:00-21:00 IST — not starting"
          fi

      - name: Runner diagnostics
        if: steps.window.outputs.inside == '1'
        run: |
          echo "Disk:"; df -h / /tmp | sed 's/^/  /'
          echo "CPU: $(nproc) cores, RAM: $(free -h | awk '/^Mem:/{print $2}')"

      - name: Install toolchain and Python env
        if: steps.window.outputs.inside == '1'
        env:
          AMATERASU_REPO: ${{ vars.AMATERASU_REPO }}
          AMATERASU_REF: ${{ vars.AMATERASU_REF }}
        run: bash amaterasu/scripts/setup-runner.sh

      - name: Run Amaterasu
        if: steps.window.outputs.inside == '1'
        env:
          BOT_MINUTES: ${{ github.event.inputs.minutes || '285' }}

          # ── Required ────────────────────────────────────────────────────
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API: ${{ secrets.TELEGRAM_API }}
          TELEGRAM_HASH: ${{ secrets.TELEGRAM_HASH }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # ── Optional but recommended ────────────────────────────────────
          USER_SESSION_STRING: ${{ secrets.USER_SESSION_STRING }}
          WEB_ACCESS_PASSWORD: ${{ secrets.WEB_ACCESS_PASSWORD }}
          HELPER_TOKENS: ${{ secrets.HELPER_TOKENS }}
          LOG_CHAT_ID: ${{ secrets.LOG_CHAT_ID }}

          # ── Harness knobs ───────────────────────────────────────────────
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          PAGES_PUBLISH: '0'
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

          # ── Runtime defaults for this platform ──────────────────────────
          PORT: '8080'
          TIMEZONE: 'Asia/Kolkata'
          BIND_TO_LOOPBACK: 'True'
          CLOUDFLARE_TUNNEL_ENABLED: 'True'
          CLOUDFLARE_TUNNEL_AUTO_URL: 'True'
          CLOUDFLARE_TUNNEL_TARGET: 'http://127.0.0.1:8080'
          AUTO_UPDATE: 'False'
          UPDATE_PKGS: 'False'

          # ── Nothing runs unless it is being used ────────────────────────
          LAZY_CONNECTIONS: '1'
          HELPER_AUTO: '1'
          HELPER_IDLE_MINUTES: '10'

          # ── Engines off: less RAM, less CPU, fewer failure modes ────────
          DISABLE_TORRENTS: 'True'
          DISABLE_NZB: 'True'
          DISABLE_JD: 'True'
          DISABLE_ENCODE: 'True'
          FFMPEG_HW_ACCEL: 'none'

        run: bash amaterasu/scripts/run-bot.sh

      - name: Upload bot log
        # only when something went wrong — no point storing 5 logs a day
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amaterasu-log
          path: |
            app/log.txt
            app/rlog.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Chain the next run
        if: always() && steps.window.outputs.inside == '1'
        env:
          PAT: ${{ secrets.PAT_TOKEN }}
          MINUTES: ${{ github.event.inputs.minutes || '285' }}
        run: |
          MIN=$(( ( $(date -u +%s) + 19800 ) % 86400 / 60 ))
          NEXT_END=$(( MIN + MINUTES + 20 ))
          echo "IST minute-of-day now: $MIN; next run would end at $NEXT_END (window closes 1260)"
          if [ "$NEXT_END" -gt 1260 ]; then
            echo "::notice::window closed — not chaining. Next start is 06:00 IST via cron."
            exit 0
          fi
          if [ -z "${PAT:-}" ]; then
            echo "::warning::PAT_TOKEN is not set, so the chain stops here. Add a fine-grained PAT with Actions: write to keep runs continuous; the cron will restart at 06:00 IST."
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer ${PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/amaterasu-bot.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"minutes\":\"${MINUTES}\",\"force\":\"false\"}}" \
            && echo "dispatched the next run"
