name: Smoke test

# Boots the bot on a runner for a few minutes, probes it on localhost, and
# commits the log plus the results. No tunnel involved, so this tests the bot
# itself rather than the plumbing around it.
#
# The report is .txt and force-added: the repo's .gitignore ignores *.log.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        env:
          AMATERASU_REPO: ${{ vars.AMATERASU_REPO }}
          AMATERASU_REF: ${{ vars.AMATERASU_REF }}
        run: bash amaterasu/scripts/setup-runner.sh

      - name: Boot the bot and probe it
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API: ${{ secrets.TELEGRAM_API }}
          TELEGRAM_HASH: ${{ secrets.TELEGRAM_HASH }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          USER_SESSION_STRING: ${{ secrets.USER_SESSION_STRING }}
          WEB_ACCESS_PASSWORD: ${{ secrets.WEB_ACCESS_PASSWORD }}
          HELPER_TOKENS: ${{ secrets.HELPER_TOKENS }}
          PORT: '8080'
          TIMEZONE: 'Asia/Kolkata'
          BIND_TO_LOOPBACK: 'True'
          CLOUDFLARE_TUNNEL_ENABLED: 'False'
          AUTO_UPDATE: 'False'
          UPDATE_PKGS: 'False'
          LAZY_CONNECTIONS: '1'
          HELPER_AUTO: '1'
          DISABLE_TORRENTS: 'True'
          DISABLE_NZB: 'True'
          DISABLE_JD: 'True'
          DISABLE_ENCODE: 'True'
          FFMPEG_HW_ACCEL: 'none'
        run: |
          mkdir -p diagnostics
          REPORT=diagnostics/smoke.txt
          : > "$REPORT"
          exec > >(tee -a "$REPORT") 2>&1
          set -u
          say() { echo "$*"; }

          APP="$GITHUB_WORKSPACE/app"
          say "=== smoke $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          say "python: $(python3 -V 2>&1)"
          say "ffmpeg: $(ffmpeg -version 2>/dev/null | head -1)"
          say "app dir: $(ls "$APP" 2>/dev/null | head -5 | tr '\n' ' ')"

          cd "$APP" || { say "FATAL: no app dir at $APP"; exit 0; }
          python -m bot > "$APP/smoke.out" 2>&1 &
          BOTPID=$!
          say "started pid $BOTPID, waiting up to 120s for the web server"

          up=0
          for i in $(seq 1 24); do
            sleep 5
            if curl -sS -m 3 -o /dev/null "http://127.0.0.1:8080/health" 2>/dev/null; then
              up=1
              say "web server answered after $((i*5))s"
              break
            fi
          done
          [ "$up" = "0" ] && say "WARNING: web server never answered on 127.0.0.1:8080"

          hit() {
            local path="$1" method="${2:-GET}" data="${3:-}"
            local out code
            out=$(mktemp)
            if [ "$method" = "POST" ]; then
              code=$(curl -sS -o "$out" -w '%{http_code}' -m 60 -X POST \
                -H 'content-type: application/json' -d "$data" "http://127.0.0.1:8080$path" || echo ERR)
            else
              code=$(curl -sS -o "$out" -w '%{http_code}' -m 30 "http://127.0.0.1:8080$path" || echo ERR)
            fi
            say ""
            say "--- $method $path -> $code"
            head -c 900 "$out" | tr -d '\r' | sed 's/^/    /'
            say ""
            rm -f "$out"
          }

          hit "/health"
          hit "/api/tunnel"
          hit "/webdl"
          hit "/webdl/api/info"
          hit "/links"
          hit "/webdl/api/probe" POST '{"url":"https://download.samplelib.com/mp4/sample-5s.mp4"}'
          hit "/webdl/api/probe" POST '{"url":"https://www.youtube.com/watch"}'

          say ""
          say "=== bot output (last 200 lines) ==="
          tail -200 "$APP/smoke.out" 2>/dev/null || say "no output captured"
          say ""
          say "=== log.txt (last 120 lines) ==="
          tail -120 "$APP/log.txt" 2>/dev/null || say "no log.txt"

          kill "$BOTPID" 2>/dev/null || true
          sleep 2
          pkill -f "python -m bot" 2>/dev/null || true
          say "=== end ==="

      - name: Commit the results
        if: always()
        run: |
          git config user.name "smoke"
          git config user.email "smoke@users.noreply.github.com"
          git add -f diagnostics/smoke.txt 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "smoke: $(date -u +%H:%MZ)"
          git push -q origin HEAD && echo "committed"
