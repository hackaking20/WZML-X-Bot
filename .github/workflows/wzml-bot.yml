name: WZML-X Bot

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'Bot run hours (default 5)'
        required: false
        default: '5'

concurrency:
  group: wzml-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download cloudflared + install deps
        run: |
          wget -q -O /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version
          pip install -q pymongo requests

      - name: Clone both branches and build both images
        env:
          UPSTREAM_REPO: ${{ secrets.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ secrets.UPSTREAM_BRANCH || 'wzv3' }}
          PLUGIN_SOURCES: ${{ secrets.PLUGIN_SOURCES }}
        shell: bash {0}
        run: |
          UP_REPO="${UPSTREAM_REPO:-https://github.com/SilentDemonSD/WZML-X}"

          # ── Clone stable branch (wzv3) ────────────────────────────
          echo "=== Cloning STABLE (wzv3) branch ==="
          git clone --depth 1 -b wzv3 "$UP_REPO" /tmp/wzml-stable

          # ── Clone plugin-dev branch ───────────────────────────────
          echo "=== Cloning PLUGIN-DEV branch ==="
          git clone --depth 1 -b plugin-dev "$UP_REPO" /tmp/wzml-plugindev || echo "WARNING: plugin-dev branch not found, will build stable only"

          # ════════════════════════════════════════════════════════════
          #  SHARED CLEANUP + PATCH FUNCTION (applied to both branches)
          # ════════════════════════════════════════════════════════════
          apply_patches() {
            local SRC_DIR="$1"
            local LABEL="$2"

            echo "=== Applying patches to $LABEL ==="

            # ── CLEANUP: remove only OS junk, Python cache, and build artifacts ──
            # Safe stuff only — nothing that's part of the bot source code.
            echo "=== Cleaning up $LABEL (OS junk + Python cache only) ==="

            # .git directory — not bot code, just commit history metadata
            rm -rf "$SRC_DIR/.git"

            # Python cache and compiled files
            find "$SRC_DIR" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
            find "$SRC_DIR" -name "*.pyc" -delete 2>/dev/null || true
            find "$SRC_DIR" -name "*.pyo" -delete 2>/dev/null || true
            find "$SRC_DIR" -name "*.pyd" -delete 2>/dev/null || true
            find "$SRC_DIR" -name ".pytest_cache" -type d -exec rm -rf {} + 2>/dev/null || true

            # Build artifacts
            find "$SRC_DIR" -name "*.egg-info" -type d -exec rm -rf {} + 2>/dev/null || true
            find "$SRC_DIR" -name "*.egg-link" -delete 2>/dev/null || true
            find "$SRC_DIR" -name ".eggs" -type d -exec rm -rf {} + 2>/dev/null || true
            find "$SRC_DIR" -name "build" -type d -exec rm -rf {} + 2>/dev/null || true
            find "$SRC_DIR" -name "dist" -type d -exec rm -rf {} + 2>/dev/null || true

            # OS junk files
            find "$SRC_DIR" -name ".DS_Store" -delete 2>/dev/null || true
            find "$SRC_DIR" -name "Thumbs.db" -delete 2>/dev/null || true
            find "$SRC_DIR" -name "*.tmp" -delete 2>/dev/null || true
            find "$SRC_DIR" -name "*.bak" -delete 2>/dev/null || true
            find "$SRC_DIR" -name "*.swp" -delete 2>/dev/null || true
            find "$SRC_DIR" -name "*~" -delete 2>/dev/null || true
            find "$SRC_DIR" -name "*.log" -delete 2>/dev/null || true

            # Any leftover .git directories in submodules
            find "$SRC_DIR" -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true

            echo "Cleanup of $LABEL complete."
            echo "Source tree size after cleanup: $(du -sh "$SRC_DIR" 2>/dev/null | cut -f1)"
            echo "File count: $(find "$SRC_DIR" -type f | wc -l) files"

            # ── PATCH: fix yt-dlp download hang ───────────────────────
            YTDLP_FILE=$(find "$SRC_DIR" -name "yt_dlp_download.py" | head -1)
            if [ -n "$YTDLP_FILE" ]; then
              echo "Patching $YTDLP_FILE ..."

              # Fix 1: Catch ALL exceptions, not just DownloadError
              sed -i 's/except DownloadError as e:/except Exception as e:/' "$YTDLP_FILE"

              # Fix 2: Remove suppress(Exception)
              sed -i 's/with suppress(Exception):/with suppress():/' "$YTDLP_FILE"

              # Fix 3: Add socket_timeout to yt-dlp opts
              sed -i '/"fragment_retries": 10,/a\            "socket_timeout": 30,' "$YTDLP_FILE"

              # Fix 4: Patch _set_options for match_filter string → callable
              sed -i '/^from yt_dlp import YoutubeDL, DownloadError$/a from yt_dlp.utils import match_filter_func' "$YTDLP_FILE"

              printf '%s\n' \
                'import sys' \
                'mf = sys.argv[1]' \
                'with open(mf, "r") as f:' \
                '    c = f.read()' \
                'old = "            else:\\n                self.opts[key] = value"' \
                'new = "            elif key == \\"match_filter\\" and isinstance(value, str):\\n                self.opts[key] = match_filter_func(value)\\n            else:\\n                self.opts[key] = value"' \
                'if old in c:' \
                '    c = c.replace(old, new, 1)' \
                '    with open(mf, "w") as f:' \
                '        f.write(c)' \
                '    print("Fix 4: _set_options patched for match_filter")' \
                'else:' \
                '    print("WARNING: Fix 4 pattern not found in _set_options")' \
                > /tmp/patch_fix4.py
              python3 /tmp/patch_fix4.py "$YTDLP_FILE"

              echo "yt-dlp patches applied."
            else
              echo "WARNING: yt_dlp_download.py not found in $LABEL, skipping patch"
            fi

            # ── COPY LOCAL PLUGINS FROM REPO ──────────────────────────
            mkdir -p "$SRC_DIR/plugins"
            # Copy spotify_plugin.py from repo checkout (use GITHUB_WORKSPACE — preserved across cd)
            REPO_ROOT="${GITHUB_WORKSPACE:-$PWD}"
            if [ -f "$REPO_ROOT/spotify_plugin.py" ]; then
              echo "Copying spotify_plugin.py to $LABEL plugins/"
              cp "$REPO_ROOT/spotify_plugin.py" "$SRC_DIR/plugins/spotify_plugin.py"
            else
              echo "WARNING: spotify_plugin.py not found in repo"
            fi
            # Copy branch_switcher.py from repo checkout
            if [ -f "$REPO_ROOT/branch_switcher.py" ]; then
              echo "Copying branch_switcher.py to $LABEL plugins/"
              cp "$REPO_ROOT/branch_switcher.py" "$SRC_DIR/plugins/branch_switcher.py"
            else
              echo "WARNING: branch_switcher.py not found in repo"
            fi
            # Copy any other .py files from repo root that look like plugins
            for f in "$REPO_ROOT"/*.py; do
              [ ! -f "$f" ] && continue
              fname=$(basename "$f")
              [ "$fname" = "spotify_plugin.py" ] && continue
              [ "$fname" = "branch_switcher.py" ] && continue
              [ "$fname" = "broadcast.py" ] && continue
              echo "Copying $fname to $LABEL plugins/"
              cp "$f" "$SRC_DIR/plugins/"
            done

            # ── DOWNLOAD REMOTE PLUGINS FROM PLUGIN_SOURCES ──────────
            # PLUGIN_SOURCES is a GitHub secret containing one URL per line.
            # Each URL should point to a raw .py file (gist or repo raw URL).
            # Example:
            #   https://raw.githubusercontent.com/user/repo/main/my_plugin.py
            #   https://gist.githubusercontent.com/user/gist-id/raw/plugin.py
            if [ -n "$PLUGIN_SOURCES" ]; then
              echo "=== Downloading remote plugins from PLUGIN_SOURCES ($LABEL) ==="
              echo "$PLUGIN_SOURCES" | while IFS= read -r url; do
                url=$(echo "$url" | tr -d '\r\n ' | xargs)
                [ -z "$url" ] && continue
                [ "${url:0:1}" = "#" ] && continue
                fname=$(basename "$url")
                echo "  Downloading: $url -> plugins/$fname"
                if curl -sfL -o "$SRC_DIR/plugins/$fname" "$url" 2>/dev/null; then
                  echo "  ✅ Downloaded $fname"
                else
                  echo "  ❌ Failed to download $fname from $url"
                fi
              done
            else
              echo "No PLUGIN_SOURCES secret set, skipping remote plugin download"
            fi

            # Modify Dockerfile to install spotdl + ffmpeg + deno
            DOCKERFILE="$SRC_DIR/Dockerfile"
            if [ -f "$DOCKERFILE" ]; then
              if ! grep -q "spotdl" "$DOCKERFILE"; then
                echo "Adding spotdl + ffmpeg + deno to Dockerfile ($LABEL)..."
                sed -i '/^COPY . .$/i RUN uv pip install --python /wzvenv/bin/python --no-cache-dir spotdl pymongo' "$DOCKERFILE"
                sed -i '/^COPY . .$/i RUN uv pip install --python /wzvenv/bin/python --no-cache-dir --upgrade yt-dlp ytmusicapi' "$DOCKERFILE"
                sed -i '/^COPY . .$/i RUN uv pip install --python /wzvenv/bin/python --no-cache-dir pymongo brotli websockets' "$DOCKERFILE"
                sed -i '/^COPY . .$/i RUN curl -fsSL https://deno.land/install.sh | sh' "$DOCKERFILE"
                sed -i '/^COPY . .$/i RUN echo y | /wzvenv/bin/spotdl --download-ffmpeg || true' "$DOCKERFILE"
                sed -i '/^COPY . .$/i RUN /wzvenv/bin/spotdl --download-deno || true' "$DOCKERFILE"
                sed -i '/^COPY . .$/i ENV PATH="/root/.deno/bin:$PATH"' "$DOCKERFILE"
                sed -i '/^COPY . .$/i RUN /wzvenv/bin/pip install -U brotli websockets' "$DOCKERFILE"
                echo "--- Updated Dockerfile ($LABEL) ---"
                cat "$DOCKERFILE"
              fi
            else
              echo "WARNING: Dockerfile not found at $DOCKERFILE"
            fi

            # ── AUTO-LOAD PLUGINS ON STARTUP ───────────────────────────
            MAINFILE="$SRC_DIR/bot/__main__.py"
            if [ -f "$MAINFILE" ]; then
              if ! grep -q "Auto-load all discovered plugins" "$MAINFILE"; then
                echo "Patching __main__.py to auto-load plugins ($LABEL)..."
                printf '%s\n' \
                  'import sys' \
                  'mf = sys.argv[1]' \
                  'with open(mf, "r") as f:' \
                  '    c = f.read()' \
                  'old = "register_plugin_commands()"' \
                  'if old in c and "Auto-load" not in c:' \
                  '    inject = old + "\n"' \
                  '    inject += "\n"' \
                  '    inject += "# Auto-load all discovered plugins on startup\n"' \
                  '    inject += "_discovered = plugin_manager.discover_plugins()\n"' \
                  '    inject += "for _pname in _discovered:\n"' \
                  '    inject += "    try:\n"' \
                  '    inject += "        bot_loop.run_until_complete(plugin_manager.load_plugin(_pname))\n"' \
                  '    inject += "    except Exception as _e:\n"' \
                  '    inject += "        LOGGER.warning(\"Failed to auto-load plugin \" + str(_pname) + \": \" + str(_e))\n"' \
                  '    c = c.replace(old, inject, 1)' \
                  '    with open(mf, "w") as f:' \
                  '        f.write(c)' \
                  '    print("__main__.py patched: plugins will auto-load on startup")' \
                  'else:' \
                  '    print("WARNING: pattern not found or already patched")' \
                  > /tmp/patch_autoload.py
                python3 /tmp/patch_autoload.py "$MAINFILE"
                echo "Verifying patch..."
                grep -n "Auto-load" "$MAINFILE" || echo "WARNING: patch not found"
              else
                echo "__main__.py already patched for auto-load ($LABEL)"
              fi
            else
              echo "WARNING: __main__.py not found in $LABEL, cannot patch auto-load"
            fi
          }

          # ════════════════════════════════════════════════════════════
          #  BUILD STABLE IMAGE (wzv3)
          # ════════════════════════════════════════════════════════════
          apply_patches /tmp/wzml-stable "STABLE (wzv3)"
          echo "=== Building STABLE Docker image ==="
          cd /tmp/wzml-stable
          docker build -t wzml-bot:stable . 2>&1 | tail -30
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "ERROR: Stable image build failed (exit code $BUILD_EXIT)"
            exit 1
          fi
          echo "Stable image built."

          # ════════════════════════════════════════════════════════════
          #  BUILD PLUGIN-DEV IMAGE (if branch was cloned)
          # ════════════════════════════════════════════════════════════
          if [ -d /tmp/wzml-plugindev ]; then
            apply_patches /tmp/wzml-plugindev "PLUGIN-DEV"
            echo "=== Building PLUGIN-DEV Docker image ==="
            cd /tmp/wzml-plugindev
            docker build -t wzml-bot:plugindev . 2>&1 | tail -30
            BUILD_EXIT=${PIPESTATUS[0]}
            if [ $BUILD_EXIT -ne 0 ]; then
              echo "WARNING: Plugin-dev image build failed (exit code $BUILD_EXIT)"
              echo "PLUGINDEV_AVAILABLE=false" >> $GITHUB_ENV
            else
              echo "Plugin-dev image built successfully."
              echo "PLUGINDEV_AVAILABLE=true" >> $GITHUB_ENV
            fi
          else
            echo "plugin-dev branch not available, only stable image built"
            echo "PLUGINDEV_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Send startup ntfy notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'JAI_HO' }}
        run: |
          curl -s -H "Title: WZML-X Bot Starting" \
            -H "Tags: rocket,gear" \
            -d "WZML-X Bot is starting up (Stable). /switch to switch branches." \
            "https://ntfy.sh/${NTFY_TOPIC}" || true

      - name: Run bot container and watch for branch switch
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          TELEGRAM_API: ${{ secrets.TELEGRAM_API }}
          TELEGRAM_HASH: ${{ secrets.TELEGRAM_HASH }}
          UPSTREAM_REPO: ${{ secrets.UPSTREAM_REPO }}
          UPSTREAM_BRANCH: ${{ secrets.UPSTREAM_BRANCH || 'wzv3' }}
          AUTHORIZED_CHATS: ${{ secrets.AUTHORIZED_CHATS }}
          SUDO_USERS: ${{ secrets.SUDO_USERS }}
          USER_SESSION_STRING: ${{ secrets.USER_SESSION_STRING }}
          GDRIVE_ID: ${{ secrets.GDRIVE_ID }}
          IS_TEAM_DRIVE: ${{ secrets.IS_TEAM_DRIVE }}
          INDEX_URL: ${{ secrets.INDEX_URL }}
          USE_SERVICE_ACCOUNTS: ${{ secrets.USE_SERVICE_ACCOUNTS }}
          RCLONE_PATH: ${{ secrets.RCLONE_PATH }}
          RCLONE_FLAGS: ${{ secrets.RCLONE_FLAGS }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          LEECH_DUMP_CHAT: ${{ secrets.LEECH_DUMP_CHAT }}
          LINKS_LOG_ID: ${{ secrets.LINKS_LOG_ID }}
          MIRROR_LOG_ID: ${{ secrets.MIRROR_LOG_ID }}
          DEFAULT_UPLOAD: ${{ secrets.DEFAULT_UPLOAD }}
          LEECH_SPLIT_SIZE: ${{ secrets.LEECH_SPLIT_SIZE }}
          WEB_ACCESS_PASSWORD: ${{ secrets.WEB_ACCESS_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'JAI_HO' }}
          PLUGINDEV_AVAILABLE: ${{ env.PLUGINDEV_AVAILABLE }}
        shell: bash {0}
        run: |
          # ════════════════════════════════════════════════════════════
          #  Create shared directory for branch switcher signal
          # ════════════════════════════════════════════════════════════
          SIGNAL_PATH="${GITHUB_WORKSPACE}/bs_signal"
          mkdir -p "$SIGNAL_PATH"
          # Clean any stale signal files from previous runs
          rm -f "$SIGNAL_PATH/switch" "$SIGNAL_PATH/.switching" 2>/dev/null || true

          # ════════════════════════════════════════════════════════════
          #  Helper: start the bot container with a given image
          # ════════════════════════════════════════════════════════════
          start_bot() {
            local IMAGE="$1"
            local LABEL="$2"

            echo "=== Starting bot with image: $IMAGE ($LABEL) ==="

            # Remove old container if exists
            docker rm -f wzml_bot 2>/dev/null || true

            # Write current branch marker
            echo "$LABEL" > "$SIGNAL_PATH/current"

            # Start container with signal volume mounted
            docker run -d \
              --name wzml_bot \
              -e BOT_TOKEN="${BOT_TOKEN}" \
              -e TELEGRAM_API="${TELEGRAM_API}" \
              -e TELEGRAM_HASH="${TELEGRAM_HASH}" \
              -e OWNER_ID="${OWNER_ID}" \
              -e DATABASE_URL="${DATABASE_URL}" \
              -e UPSTREAM_REPO="${UPSTREAM_REPO}" \
              -e UPSTREAM_BRANCH="${UPSTREAM_BRANCH}" \
              -e AUTHORIZED_CHATS="${AUTHORIZED_CHATS}" \
              -e SUDO_USERS="${SUDO_USERS}" \
              -e USER_SESSION_STRING="${USER_SESSION_STRING}" \
              -e GDRIVE_ID="${GDRIVE_ID}" \
              -e IS_TEAM_DRIVE="${IS_TEAM_DRIVE}" \
              -e INDEX_URL="${INDEX_URL}" \
              -e USE_SERVICE_ACCOUNTS="${USE_SERVICE_ACCOUNTS}" \
              -e RCLONE_PATH="${RCLONE_PATH}" \
              -e RCLONE_FLAGS="${RCLONE_FLAGS}" \
              -e MEGA_EMAIL="${MEGA_EMAIL}" \
              -e MEGA_PASSWORD="${MEGA_PASSWORD}" \
              -e LEECH_DUMP_CHAT="${LEECH_DUMP_CHAT}" \
              -e LINKS_LOG_ID="${LINKS_LOG_ID}" \
              -e MIRROR_LOG_ID="${MIRROR_LOG_ID}" \
              -e DEFAULT_UPLOAD="${DEFAULT_UPLOAD}" \
              -e LEECH_SPLIT_SIZE="${LEECH_SPLIT_SIZE}" \
              -e WEB_ACCESS_PASSWORD="${WEB_ACCESS_PASSWORD}" \
              -e TIMEZONE="Asia/Kolkata" \
              -e BRANCH_LABEL="${LABEL}" \
              -v "$SIGNAL_PATH":/bs_signal \
              -p 8080:8080 \
              "$IMAGE"

            echo "Waiting 60 seconds for bot startup..."
            sleep 60

            if docker inspect -f '{{.State.Running}}' wzml_bot 2>/dev/null | grep -q true; then
              echo "=== Bot container is RUNNING (image: $IMAGE) ==="
              echo "=== DOCKER LOGS (last 30 lines) ==="
              docker logs wzml_bot 2>&1 | tail -30

              # Send notification about branch
              BRANCH_DISPLAY="Stable (wzv3)"
              [ "$LABEL" = "plugindev" ] && BRANCH_DISPLAY="Plugin-Dev"
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\": ${OWNER_ID}, \"text\": \"✅ Bot is running on: ${BRANCH_DISPLAY}\n\nUse /switch to switch branches.\"}" \
                > /dev/null 2>&1 || true
            else
              echo "=== !!! Bot container CRASHED !!! ==="
              echo "=== FULL DOCKER LOGS ==="
              docker logs wzml_bot 2>&1 || echo "(no logs)"
              echo ""
              echo "=== Container exit code ==="
              docker inspect -f '{{.State.ExitCode}}' wzml_bot 2>/dev/null || echo "unknown"
              echo ""
              echo "=== Re-running in foreground to capture error ==="
              docker rm -f wzml_bot 2>/dev/null || true
              timeout 60 docker run --rm \
                --name wzml_bot_debug \
                -e BOT_TOKEN="${BOT_TOKEN}" \
                -e TELEGRAM_API="${TELEGRAM_API}" \
                -e TELEGRAM_HASH="${TELEGRAM_HASH}" \
                -e OWNER_ID="${OWNER_ID}" \
                -e DATABASE_URL="${DATABASE_URL}" \
                -e UPSTREAM_REPO="${UPSTREAM_REPO}" \
                -e UPSTREAM_BRANCH="${UPSTREAM_BRANCH}" \
                -e TIMEZONE="Asia/Kolkata" \
                -v "$SIGNAL_PATH":/bs_signal \
                "$IMAGE" 2>&1 | tail -80 || echo "(foreground run timed out or failed)"
              echo ""
              echo "=== CRASH DIAGNOSTICS COMPLETE ==="
              # Retry with full env vars
              docker rm -f wzml_bot 2>/dev/null || true
              docker run -d \
                --name wzml_bot \
                -e BOT_TOKEN="${BOT_TOKEN}" \
                -e TELEGRAM_API="${TELEGRAM_API}" \
                -e TELEGRAM_HASH="${TELEGRAM_HASH}" \
                -e OWNER_ID="${OWNER_ID}" \
                -e DATABASE_URL="${DATABASE_URL}" \
                -e UPSTREAM_REPO="${UPSTREAM_REPO}" \
                -e UPSTREAM_BRANCH="${UPSTREAM_BRANCH}" \
                -e AUTHORIZED_CHATS="${AUTHORIZED_CHATS}" \
                -e SUDO_USERS="${SUDO_USERS}" \
                -e USER_SESSION_STRING="${USER_SESSION_STRING}" \
                -e GDRIVE_ID="${GDRIVE_ID}" \
                -e IS_TEAM_DRIVE="${IS_TEAM_DRIVE}" \
                -e INDEX_URL="${INDEX_URL}" \
                -e USE_SERVICE_ACCOUNTS="${USE_SERVICE_ACCOUNTS}" \
                -e RCLONE_PATH="${RCLONE_PATH}" \
                -e RCLONE_FLAGS="${RCLONE_FLAGS}" \
                -e MEGA_EMAIL="${MEGA_EMAIL}" \
                -e MEGA_PASSWORD="${MEGA_PASSWORD}" \
                -e LEECH_DUMP_CHAT="${LEECH_DUMP_CHAT}" \
                -e LINKS_LOG_ID="${LINKS_LOG_ID}" \
                -e MIRROR_LOG_ID="${MIRROR_LOG_ID}" \
                -e DEFAULT_UPLOAD="${DEFAULT_UPLOAD}" \
                -e LEECH_SPLIT_SIZE="${LEECH_SPLIT_SIZE}" \
                -e WEB_ACCESS_PASSWORD="${WEB_ACCESS_PASSWORD}" \
                -e TIMEZONE="Asia/Kolkata" \
                -e BRANCH_LABEL="${LABEL}" \
                -v "$SIGNAL_PATH":/bs_signal \
                -p 8080:8080 \
                "$IMAGE"
              sleep 15
            fi
          }

          # ════════════════════════════════════════════════════════════
          #  Start with STABLE by default
          # ════════════════════════════════════════════════════════════
          CURRENT_IMAGE="wzml-bot:stable"
          CURRENT_LABEL="stable"
          start_bot "$CURRENT_IMAGE" "$CURRENT_LABEL"

      - name: Start tunnel + broadcasts + keep-alive + branch switch monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'JAI_HO' }}
          RUN_HOURS: ${{ github.event.inputs.hours || '5' }}
          PLUGINDEV_AVAILABLE: ${{ env.PLUGINDEV_AVAILABLE }}
        shell: bash {0}
        run: |
          HOURS=$(echo "${RUN_HOURS}" | bc -l 2>/dev/null || echo "5")
          TOTAL_SEC=$(echo "$HOURS * 3600" | bc -l 2>/dev/null || echo "18000")
          TOTAL_SEC=$(printf "%.0f" "$TOTAL_SEC")

          echo "Bot will run for $((TOTAL_SEC / 3600))h $(((TOTAL_SEC % 3600) / 60))m"

          SIGNAL_PATH="${GITHUB_WORKSPACE}/bs_signal"
          CURRENT_LABEL="stable"

          # --- Start Cloudflare tunnel ---
          /tmp/cloudflared tunnel --url http://localhost:8080 > /tmp/cloudflared.log 2>&1 &

          TUNNEL_URL=""
          for i in $(seq 1 30); do
            sleep 2
            TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              break
            fi
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "WARNING: No tunnel URL obtained"
          else
            echo "Tunnel URL: $TUNNEL_URL"
          fi

          # --- Background: startup broadcast at +5 min ---
          (
            sleep 300
            REGULAR_MSG=$(printf 'WZML-X Bot is LIVE!\n\nThe bot is now online and ready to use.\nSend /help to see available commands.\nUse /switch to switch between Stable and Plugin-Dev branches.\nBot will run for ~5 hours, then restart after a 30 min break.')
            if [ -n "$TUNNEL_URL" ]; then
              OWNER_MSG=$(printf 'WZML-X Bot is LIVE!\n\nThe bot is now online and ready to use.\nWeb UI: %s\n\nSend /help to see available commands.\nUse /switch to switch between Stable and Plugin-Dev branches.\nBot will run for ~5 hours, then restart after a 30 min break.' "$TUNNEL_URL")
            else
              OWNER_MSG="$REGULAR_MSG"
            fi

            echo "[$(date +%H:%M:%S)] Sending startup broadcast to all users..."
            python3 broadcast.py "$REGULAR_MSG" "$OWNER_MSG" || echo "Broadcast failed (non-fatal)"

            curl -s -X POST \
              -H "Title: WZML-X Bot is LIVE!" \
              -H "Priority: 4" \
              -H "Tags: tada,rocket,gear" \
              -H "Click: ${TUNNEL_URL}" \
              -d "Bot is live! Web URL: ${TUNNEL_URL:-N/A}" \
              "https://ntfy.sh/${NTFY_TOPIC}" || true
          ) &

          # --- Background: pre-shutdown broadcast at -10 min ---
          PRE_SHUTDOWN_WAIT=$((TOTAL_SEC - 600))
          (
            sleep $PRE_SHUTDOWN_WAIT
            MSG=$(printf 'WZML-X Bot Restarting Soon!\n\nThe bot will go down in 10 minutes for a scheduled restart.\nAll active downloads will be paused and resume automatically after restart.\n\nDowntime: ~30 minutes\nThe bot will come back online automatically via the scheduled timer.\n\nThank you for your patience!')

            echo "[$(date +%H:%M:%S)] Sending pre-shutdown broadcast to all users..."
            python3 broadcast.py "$MSG" || echo "Broadcast failed (non-fatal)"

            curl -s -X POST \
              -H "Title: Bot Restarting in 10 min" \
              -H "Priority: 4" \
              -H "Tags: warning,clock,refresh" \
              -d "Bot going down in 10 min for scheduled restart. Back in ~30 min." \
              "https://ntfy.sh/${NTFY_TOPIC}" || true
          ) &

          # --- Main keep-alive loop with branch switch monitoring ---
          ELAPSED=0
          INTERVAL=120
          PING_COUNT=0

          while [ $ELAPSED -lt $TOTAL_SEC ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            PING_COUNT=$((PING_COUNT + 1))

            # ── Check for branch switch signal ──
            if [ -f "$SIGNAL_PATH/switch" ]; then
              TARGET=$(cat "$SIGNAL_PATH/switch" 2>/dev/null | tr -d '\r\n ' | xargs)
              LOCK="$SIGNAL_PATH/.switching"

              if [ -n "$TARGET" ] && [ "$TARGET" != "$CURRENT_LABEL" ]; then
                echo "[$(date +%H:%M:%S)] Branch switch signal detected: $CURRENT_LABEL -> $TARGET"

                # Determine image
                NEW_IMAGE="wzml-bot:stable"
                [ "$TARGET" = "plugindev" ] && NEW_IMAGE="wzml-bot:plugindev"

                if [ "$TARGET" = "plugindev" ] && [ "$PLUGINDEV_AVAILABLE" != "true" ]; then
                  echo "  Plugin-Dev image not available, cannot switch"
                  curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                    -H "Content-Type: application/json" \
                    -d "{\"chat_id\": ${OWNER_ID}, \"text\": \"❌ Cannot switch to Plugin-Dev: image not built (branch may not exist).\"}" \
                    > /dev/null 2>&1 || true
                  rm -f "$SIGNAL_PATH/switch" "$LOCK" 2>/dev/null || true
                else
                  # Stop current container
                  echo "  Stopping current container..."
                  docker stop wzml_bot 2>/dev/null || true
                  docker rm -f wzml_bot 2>/dev/null || true

                  # Start new image
                  echo "  Starting $NEW_IMAGE..."
                  CURRENT_LABEL="$TARGET"
                  echo "$TARGET" > "$SIGNAL_PATH/current"

                  docker run -d \
                    --name wzml_bot \
                    -e BOT_TOKEN="${BOT_TOKEN}" \
                    -e TELEGRAM_API="${TELEGRAM_API}" \
                    -e TELEGRAM_HASH="${TELEGRAM_HASH}" \
                    -e OWNER_ID="${OWNER_ID}" \
                    -e DATABASE_URL="${DATABASE_URL}" \
                    -e UPSTREAM_REPO="${UPSTREAM_REPO}" \
                    -e UPSTREAM_BRANCH="${UPSTREAM_BRANCH}" \
                    -e AUTHORIZED_CHATS="${AUTHORIZED_CHATS}" \
                    -e SUDO_USERS="${SUDO_USERS}" \
                    -e USER_SESSION_STRING="${USER_SESSION_STRING}" \
                    -e GDRIVE_ID="${GDRIVE_ID}" \
                    -e IS_TEAM_DRIVE="${IS_TEAM_DRIVE}" \
                    -e INDEX_URL="${INDEX_URL}" \
                    -e USE_SERVICE_ACCOUNTS="${USE_SERVICE_ACCOUNTS}" \
                    -e RCLONE_PATH="${RCLONE_PATH}" \
                    -e RCLONE_FLAGS="${RCLONE_FLAGS}" \
                    -e MEGA_EMAIL="${MEGA_EMAIL}" \
                    -e MEGA_PASSWORD="${MEGA_PASSWORD}" \
                    -e LEECH_DUMP_CHAT="${LEECH_DUMP_CHAT}" \
                    -e LINKS_LOG_ID="${LINKS_LOG_ID}" \
                    -e MIRROR_LOG_ID="${MIRROR_LOG_ID}" \
                    -e DEFAULT_UPLOAD="${DEFAULT_UPLOAD}" \
                    -e LEECH_SPLIT_SIZE="${LEECH_SPLIT_SIZE}" \
                    -e WEB_ACCESS_PASSWORD="${WEB_ACCESS_PASSWORD}" \
                    -e TIMEZONE="Asia/Kolkata" \
                    -e BRANCH_LABEL="${TARGET}" \
                    -v "$SIGNAL_PATH":/bs_signal \
                    -p 8080:8080 \
                    "$NEW_IMAGE"

                  sleep 300

                  if docker inspect -f '{{.State.Running}}' wzml_bot 2>/dev/null | grep -q true; then
                    echo "  [+] Bot switched to $TARGET successfully!"
                    BRANCH_DISPLAY="Stable (wzv3)"
                    [ "$TARGET" = "plugindev" ] && BRANCH_DISPLAY="Plugin-Dev"
                    curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                      -H "Content-Type: application/json" \
                      -d "{\"chat_id\": ${OWNER_ID}, \"text\": \"✅ Switched to ${BRANCH_DISPLAY}. Bot is back online.\"}" \
                      > /dev/null 2>&1 || true
                  else
                    echo "  [!] Bot failed to start on $TARGET! Capturing logs before revert..."
                    echo "  === FAILED CONTAINER LOGS (last 80 lines) ==="
                    docker logs wzml_bot 2>&1 | tail -80 || echo "(no logs available)"
                    echo "  === END FAILED CONTAINER LOGS ==="
                    echo "  Container exit code: $(docker inspect -f '{{.State.ExitCode}}' wzml_bot 2>/dev/null || echo unknown)"
                    docker rm -f wzml_bot 2>/dev/null || true
                    CURRENT_LABEL="stable"
                    echo "stable" > "$SIGNAL_PATH/current"
                    docker run -d \
                      --name wzml_bot \
                      -e BOT_TOKEN="${BOT_TOKEN}" \
                      -e TELEGRAM_API="${TELEGRAM_API}" \
                      -e TELEGRAM_HASH="${TELEGRAM_HASH}" \
                      -e OWNER_ID="${OWNER_ID}" \
                      -e DATABASE_URL="${DATABASE_URL}" \
                      -e UPSTREAM_REPO="${UPSTREAM_REPO}" \
                      -e UPSTREAM_BRANCH="${UPSTREAM_BRANCH}" \
                      -e AUTHORIZED_CHATS="${AUTHORIZED_CHATS}" \
                      -e SUDO_USERS="${SUDO_USERS}" \
                      -e USER_SESSION_STRING="${USER_SESSION_STRING}" \
                      -e GDRIVE_ID="${GDRIVE_ID}" \
                      -e IS_TEAM_DRIVE="${IS_TEAM_DRIVE}" \
                      -e INDEX_URL="${INDEX_URL}" \
                      -e USE_SERVICE_ACCOUNTS="${USE_SERVICE_ACCOUNTS}" \
                      -e RCLONE_PATH="${RCLONE_PATH}" \
                      -e RCLONE_FLAGS="${RCLONE_FLAGS}" \
                      -e MEGA_EMAIL="${MEGA_EMAIL}" \
                      -e MEGA_PASSWORD="${MEGA_PASSWORD}" \
                      -e LEECH_DUMP_CHAT="${LEECH_DUMP_CHAT}" \
                      -e LINKS_LOG_ID="${LINKS_LOG_ID}" \
                      -e MIRROR_LOG_ID="${MIRROR_LOG_ID}" \
                      -e DEFAULT_UPLOAD="${DEFAULT_UPLOAD}" \
                      -e LEECH_SPLIT_SIZE="${LEECH_SPLIT_SIZE}" \
                      -e WEB_ACCESS_PASSWORD="${WEB_ACCESS_PASSWORD}" \
                      -e TIMEZONE="Asia/Kolkata" \
                      -e BRANCH_LABEL="stable" \
                      -v "$SIGNAL_PATH":/bs_signal \
                      -p 8080:8080 \
                      wzml-bot:stable
                    sleep 30
                    curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                      -H "Content-Type: application/json" \
                      -d "{\"chat_id\": ${OWNER_ID}, \"text\": \"⚠️ Failed to start on ${TARGET}. Reverted to Stable. Check logs.\"}" \
                      > /dev/null 2>&1 || true
                  fi

                  # Clean up signal files
                  rm -f "$SIGNAL_PATH/switch" "$LOCK" 2>/dev/null || true
                fi
              else
                # Stale or same-branch signal, clean up
                rm -f "$SIGNAL_PATH/switch" "$LOCK" 2>/dev/null || true
              fi
            fi

            # ── Regular health check ──
            BOT_UP="UP"
            CF_UP="UP"
            docker inspect -f '{{.State.Running}}' wzml_bot 2>/dev/null | grep -q true || BOT_UP="DOWN"
            ps aux | grep cloudflared | grep -v grep >/dev/null 2>&1 || CF_UP="DOWN"

            REMAINING=$((TOTAL_SEC - ELAPSED))
            echo "[$(date +%H:%M:%S)] Check #${PING_COUNT} | Bot: ${BOT_UP} | Tunnel: ${CF_UP} | Branch: ${CURRENT_LABEL} | ${REMAINING}s left"

            if [ "$BOT_UP" = "DOWN" ]; then
              echo "  [!] Bot container is DOWN!"
              echo "  Last 20 log lines:"
              docker logs wzml_bot 2>&1 | tail -20

              if [ $PING_COUNT -le 3 ]; then
                echo "  Attempting restart..."
                docker start wzml_bot 2>/dev/null || true
                sleep 10
                docker inspect -f '{{.State.Running}}' wzml_bot 2>/dev/null | grep -q true && echo "  [+] Bot restarted!" || echo "  [!] Bot restart failed"
              else
                echo "  Bot has been down for multiple checks. Sending alert..."
                curl -s -X POST \
                  -H "Title: Bot CRASHED!" \
                  -H "Priority: 5" \
                  -H "Tags: x,warning" \
                  -d "Bot container is DOWN! Check GitHub Actions logs. Check #${PING_COUNT}" \
                  "https://ntfy.sh/${NTFY_TOPIC}" || true
                break
              fi
            fi

            if [ "$CF_UP" = "DOWN" ]; then
              echo "  [!] Tunnel down. Restarting cloudflared..."
              pkill -f cloudflared 2>/dev/null
              sleep 2
              /tmp/cloudflared tunnel --url http://localhost:8080 > /tmp/cloudflared.log 2>&1 &
              sleep 10
              NEW_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -1)
              if [ -n "$NEW_URL" ]; then
                TUNNEL_URL="$NEW_URL"
                echo "  [+] Tunnel restarted! New URL: $TUNNEL_URL"
                curl -s -X POST \
                  -H "Title: Tunnel Restart" \
                  -H "Priority: 4" \
                  -H "Tags: warning,refresh" \
                  -H "Click: ${TUNNEL_URL}" \
                  -d "Web tunnel restarted. New URL: ${TUNNEL_URL}" \
                  "https://ntfy.sh/${NTFY_TOPIC}" || true
              else
                echo "  [!] Tunnel restart failed"
              fi
            fi
          done

          echo "Bot run time complete. Stopping."

      - name: Stop bot container
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'JAI_HO' }}
        run: |
          echo "=== FINAL DOCKER LOGS ==="
          docker logs wzml_bot 2>&1 | tail -50 || true
          docker stop wzml_bot 2>/dev/null || true
          docker rm wzml_bot 2>/dev/null || true
          curl -s -X POST \
            -H "Title: Bot Session Ended" \
            -H "Priority: 3" \
            -H "Tags: wave,sleep" \
            -d "Bot session ended after 5h. Will restart in ~30 min via scheduled timer." \
            "https://ntfy.sh/${NTFY_TOPIC}" || true