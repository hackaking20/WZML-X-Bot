name: Token check

# Diagnoses the candidate tokens without printing them. Each possible HTTP
# status gets its own step, so the status can be read from which step ran —
# no job-log access needed.
#
#   200 -> valid token, and the identity step below confirms whose
#   401 -> not a GitHub token at all, or revoked/expired
#   403 -> a real token, but blocked or under-scoped
#   ERR -> the request never completed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe P81
        id: p81
        env: { T: '${{ secrets.P81 }}' }
        run: |
          if [ -z "${T:-}" ]; then echo "code=EMPTY" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=$(curl -sS -o /tmp/b -w '%{http_code}' -H "Authorization: Bearer $T" \
            https://api.github.com/user 2>/dev/null || echo ERR)
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: P81 -> 200 valid token
        if: steps.p81.outputs.code == '200'
        run: echo "P81 is a working GitHub token"
      - name: P81 -> 401 not a GitHub token / revoked
        if: steps.p81.outputs.code == '401'
        run: echo "P81 is not a valid GitHub token"
      - name: P81 -> 403 valid but blocked
        if: steps.p81.outputs.code == '403'
        run: echo "P81 is a real token but lacks access"
      - name: P81 -> EMPTY
        if: steps.p81.outputs.code == 'EMPTY'
        run: echo "P81 is empty"
      - name: P81 -> other / network error
        if: steps.p81.outputs.code != '200' && steps.p81.outputs.code != '401' && steps.p81.outputs.code != '403' && steps.p81.outputs.code != 'EMPTY'
        run: echo "unexpected result"

      - name: Probe PAT_TOKEN
        id: pat
        env: { T: '${{ secrets.PAT_TOKEN }}' }
        run: |
          if [ -z "${T:-}" ]; then echo "code=EMPTY" >> "$GITHUB_OUTPUT"; exit 0; fi
          code=$(curl -sS -o /tmp/b -w '%{http_code}' -H "Authorization: Bearer $T" \
            https://api.github.com/user 2>/dev/null || echo ERR)
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: PAT_TOKEN -> 200 valid token
        if: steps.pat.outputs.code == '200'
        run: echo "PAT_TOKEN is a working GitHub token"
      - name: PAT_TOKEN -> 401 not a GitHub token / revoked
        if: steps.pat.outputs.code == '401'
        run: echo "PAT_TOKEN is not a valid GitHub token"
      - name: PAT_TOKEN -> 403 valid but blocked
        if: steps.pat.outputs.code == '403'
        run: echo "PAT_TOKEN is a real token but lacks access"
      - name: PAT_TOKEN -> EMPTY (not set)
        if: steps.pat.outputs.code == 'EMPTY'
        run: echo "PAT_TOKEN is not set"
