name: Token check

# Answers four questions about each candidate token, one step per question, so
# the result is readable without job-log access:
#   is it set / is it valid / can it read Actions / can it dispatch
# Never prints a token. The dispatch test starts a cheap tests run.

on:
  workflow_dispatch:
    inputs:
      dispatch_test:
        description: 'Test the dispatch permission too (starts a tests run)'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  p81:
    name: P81
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: P81 is set
        env: { T: '${{ secrets.P81 }}' }
        run: |
          [ -n "$T" ] || { echo "P81 is empty or missing"; exit 1; }
          echo "P81 present, length ${#T}"

      - name: P81 is a valid token
        if: always()
        env: { T: '${{ secrets.P81 }}' }
        run: |
          [ -n "$T" ] || exit 1
          code=$(curl -sS -o /tmp/b -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/user)
          echo "GET /user -> $code"
          [ "$code" = "200" ] || { cat /tmp/b; exit 1; }

      - name: P81 can read Actions
        if: always()
        env: { T: '${{ secrets.P81 }}' }
        run: |
          [ -n "$T" ] || exit 1
          code=$(curl -sS -o /tmp/b -w '%{http_code}' -H "Authorization: Bearer $T" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows")
          echo "GET actions/workflows -> $code"
          [ "$code" = "200" ] || { cat /tmp/b; exit 1; }

      - name: P81 can dispatch a workflow
        if: always() && github.event.inputs.dispatch_test == 'true'
        env: { T: '${{ secrets.P81 }}' }
        run: |
          [ -n "$T" ] || exit 1
          code=$(curl -sS -o /tmp/b -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/amaterasu-tests.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "POST dispatch -> $code (204 = allowed)"
          [ "$code" = "204" ] || { cat /tmp/b; exit 1; }

  pat:
    name: PAT_TOKEN
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: PAT_TOKEN is set
        env: { T: '${{ secrets.PAT_TOKEN }}' }
        run: |
          [ -n "$T" ] || { echo "PAT_TOKEN is empty or missing (not an error — the chain just stops)"; exit 1; }
          echo "PAT_TOKEN present, length ${#T}"

      - name: PAT_TOKEN is a valid token
        if: always()
        env: { T: '${{ secrets.PAT_TOKEN }}' }
        run: |
          [ -n "$T" ] || exit 1
          code=$(curl -sS -o /tmp/b -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/user)
          echo "GET /user -> $code"
          [ "$code" = "200" ] || { cat /tmp/b; exit 1; }
