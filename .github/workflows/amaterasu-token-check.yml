name: Token check

# Validates the tokens available to this repo without touching the bot.
# Reports, for each candidate: is it a valid token, whose is it, can it read
# Actions, and can it dispatch a workflow. Never prints the token itself.

on:
  workflow_dispatch:
    inputs:
      dispatch_test:
        description: 'Also test the dispatch permission (starts a cheap tests run)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect tokens
        env:
          REPO: ${{ github.repository }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          P81: ${{ secrets.P81 }}
          DISPATCH_TEST: ${{ github.event.inputs.dispatch_test || 'false' }}
        run: |
          set -uo pipefail
          echo "repo: $REPO"
          echo

          probe() {
            local label="$1" token="$2"
            echo "── $label ──────────────────────────────────────────"
            if [ -z "$token" ]; then
              echo "  not set (empty or missing)"
              echo
              return
            fi
            echo "  present: yes (length ${#token}, prefix '${token:0:4}…')"

            local body code
            body=$(mktemp)
            code=$(curl -sS -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user" || echo ERR)
            echo "  GET /user            -> $code"
            if [ "$code" = "200" ]; then
              echo "     identity: $(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d.get("login"))' "$body")"
              echo "     token type: $(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print("fine-grained/bot" if str(d.get("id","")).startswith("") else "unknown")' "$body")"
            else
              echo "     body: $(head -c 200 "$body")"
            fi

            code=$(curl -sS -o "$body" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows" || echo ERR)
            echo "  GET actions/workflows -> $code  (read permission)"

            if [ "$DISPATCH_TEST" = "true" ]; then
              code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $token" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/actions/workflows/amaterasu-tests.yml/dispatches" \
                -d '{"ref":"main"}' || echo ERR)
              echo "  POST dispatch        -> $code  (write permission; 204 = allowed)"
              [ "$code" != "204" ] && echo "     body: $(head -c 200 "$body")"
            else
              echo "  POST dispatch        -> skipped (dispatch_test=false)"
            fi
            rm -f "$body"
            echo
          }

          probe "PAT_TOKEN" "${PAT_TOKEN:-}"
          probe "P81" "${P81:-}"

          echo "Reminder: the bot's chain step uses secrets.PAT_TOKEN."
