name: Amaterasu tests

# Two jobs: the offline suites (fast, no network) and the live probes
# (needs real internet, so it only ever runs here on a runner — never in
# a restricted sandbox). Dispatch it by hand after changing a plugin.

on:
  workflow_dispatch:
  push:
    paths:
      - 'amaterasu/plugins/**'
      - 'amaterasu/web/**'
      - 'amaterasu/cloudflare-worker/**'
      - 'amaterasu/scripts/test-*'

permissions:
  contents: read

jobs:
  offline:
    name: Offline suites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          # pyrogram: the plugins import it at module level
          # fastapi + httpx: the webdl suite drives a real TestClient
          # yt-dlp + mutagen: imported by webdl/music at call time
          python -m pip install --quiet pyrogram fastapi httpx yt-dlp mutagen

      - name: Music plugin
        run: python amaterasu/scripts/test-music-plugin.py

      - name: Quota plugin
        run: python amaterasu/scripts/test-quota.py

      - name: Web downloader
        run: python amaterasu/scripts/test-webdl.py

      - name: Cloudflare Worker
        run: |
          cd amaterasu/cloudflare-worker
          cp worker.js worker.mjs
          node test-worker.mjs
          rm -f worker.mjs

  pages:
    name: Pages redirect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the site serves the redirect
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          SITE="https://${OWNER}.github.io/${REPO}/"
          echo "site: $SITE"

          code=$(curl -s -o /tmp/index.html -w '%{http_code}' -m 30 "$SITE" || echo ERR)
          echo "index status: $code"
          if [ "$code" != "200" ]; then
            if [ "${PAGES_EXPECTED:-0}" = "1" ]; then
              echo "::error::Pages is expected but not serving (status $code)"
              exit 1
            fi
            echo "::notice::Pages is not enabled on this repo — skipping the hub checks"
            echo "SKIP_PAGES=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # the root is a hub now, not a redirect: it must unlock a vault and
          # read the live tunnel rather than bounce the visitor straight there
          grep -q "vault.json" /tmp/index.html || { echo "::error::the hub does not reference vault.json"; exit 1; }
          grep -q "crypto.subtle" /tmp/index.html || { echo "::error::the hub has no decryption logic"; exit 1; }
          grep -q "tunnel.json" /tmp/index.html || { echo "::error::the hub does not read tunnel.json"; exit 1; }
          echo "index.html is the hub and looks right"

          # deep links are served by 404.html — check the body, not the status
          curl -s -o /tmp/deep.html -m 30 "$SITE/webdl" || true
          if grep -q "tunnel.json" /tmp/deep.html; then
            echo "404.html handles deep links"
          else
            echo "::warning::deep-link fallback did not return the redirect page"
          fi

      - name: The vault must contain no plaintext
        run: |
          set -euo pipefail
          if [ ! -f amaterasu/vault.json ]; then
            echo "::warning::no vault.json — the hub will ask for one"
            exit 0
          fi
          python3 - <<'PY'
          import json
          import sys

          vault = json.load(open("amaterasu/vault.json", encoding="utf-8"))
          raw = open("amaterasu/vault.json", encoding="utf-8").read()

          for key in ("data", "iv", "kdf"):
              if key not in vault:
                  print(f"::error::vault.json is missing {key}")
                  sys.exit(1)
          if vault["kdf"].get("iter", 0) < 100000:
              print("::error::vault.json uses too few PBKDF2 iterations")
              sys.exit(1)
          for leak in ('"pages"', "Downloader", '"pass"', "webdl"):
              if leak in raw:
                  print(f"::error::vault.json contains plaintext: {leak}")
                  sys.exit(1)
          print("vault ok: " + str(vault["kdf"]["iter"]) + " iterations, "
                + str(len(vault["data"])) + " bytes of ciphertext")
          PY

      - name: Every page's JavaScript must parse
        run: |
          set -euo pipefail
          for page in amaterasu/index.html amaterasu/404.html amaterasu/webdl.html amaterasu/vault-maker.html; do
            python3 - "$page" <<'PY'
          import re
          import subprocess
          import sys
          import tempfile

          name = sys.argv[1]
          html = open(name, encoding="utf-8").read()
          blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not blocks:
              print(f"::error::{name} has no inline script")
              sys.exit(1)
          for index, js in enumerate(blocks):
              with tempfile.NamedTemporaryFile("w", suffix=".mjs", delete=False) as handle:
                  handle.write(js)
                  path = handle.name
              result = subprocess.run(["node", "--check", path], capture_output=True, text=True)
              if result.returncode != 0:
                  print(f"::error::{name} script {index} does not parse: {result.stderr[:300]}")
                  sys.exit(1)
          print(f"{name}: JavaScript parses")
          PY
          done

      - name: The downloader page is served
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          code=$(curl -s -o /tmp/webdl.html -w '%{http_code}' -m 30 "https://${OWNER}.github.io/${REPO}/webdl.html" || echo ERR)
          echo "webdl.html status: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::webdl.html is not on Pages (fine if you host the UI on the bot only)"
          else
            grep -q "Amaterasu downloader" /tmp/webdl.html || { echo "::error::served page is not the downloader UI"; exit 1; }
            echo "downloader page serves correctly"
          fi

      - name: Check the published tunnel state
        if: env.SKIP_PAGES != '1'
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          curl -s -m 30 -o /tmp/state.json             "https://raw.githubusercontent.com/${OWNER}/${REPO}/main/tunnel.json" || true
          cat /tmp/state.json || true
          python3 - <<'PY'
          import json
          import sys
          try:
              state = json.load(open("/tmp/state.json"))
          except Exception as error:
              print(f"::error::tunnel.json unreadable: {error}")
              sys.exit(1)
          url = state.get("url", "")
          stamp = state.get("updated", "")
          if not (url.startswith("https://") and "trycloudflare.com" in url):
              print(f"::error::tunnel url looks wrong: {url!r}")
              sys.exit(1)
          if not stamp:
              print("::error::tunnel.json has no timestamp")
              sys.exit(1)
          print(f"state ok: {url} at {stamp}")
          open("/tmp/tunnel_url", "w").write(url)
          PY

      - name: Is the bot answering right now?
        if: env.SKIP_PAGES != '1'
        continue-on-error: true
        run: |
          URL=$(cat /tmp/tunnel_url)
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 "$URL/health" || echo 000)
          echo "GET $URL/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::tunnel not answering (normal between 5-hourly runs)"
          fi

  live:
    name: Live network probes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyrogram fastapi httpx yt-dlp[default,curl-cffi] mutagen

      - name: Live probes (Deezer, JioSaavn, Spotify, yt-dlp, real downloads)
        run: python amaterasu/scripts/test-live.py

      - name: Provider health summary
        if: always()
        run: |
          echo "### Live probe result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "See the 'Live probes' step above for the per-provider table." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
