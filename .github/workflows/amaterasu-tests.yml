name: Amaterasu tests

# Two jobs: the offline suites (fast, no network) and the live probes
# (needs real internet, so it only ever runs here on a runner — never in
# a restricted sandbox). Dispatch it by hand after changing a plugin.

on:
  # Manual only. A push trigger fired three runs from one batch of file edits,
  # and nothing here needs to run unless something actually changed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline suites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          # pyrogram: the plugins import it at module level
          # fastapi + httpx: the webdl suite drives a real TestClient
          # yt-dlp + mutagen: imported by webdl/music at call time
          python -m pip install --quiet pyrogram fastapi httpx yt-dlp mutagen

      - name: Music plugin
        run: python amaterasu/scripts/test-music-plugin.py

      - name: Quota plugin
        run: python amaterasu/scripts/test-quota.py

      - name: Web downloader
        run: python amaterasu/scripts/test-webdl.py

      - name: Cloudflare Worker
        run: |
          cd amaterasu/cloudflare-worker
          cp worker.js worker.mjs
          node test-worker.mjs
          rm -f worker.mjs

  pages:
    name: Pages redirect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check the homepage serves
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          SITE="https://${OWNER}.github.io/${REPO}/"
          echo "site: $SITE"

          code=$(curl -s -o /tmp/index.html -w '%{http_code}' -m 30 "$SITE" || echo ERR)
          echo "index status: $code"
          if [ "$code" != "200" ]; then
            if [ "${PAGES_EXPECTED:-0}" = "1" ]; then
              echo "::error::Pages is expected but not serving (status $code)"
              exit 1
            fi
            echo "::notice::Pages is not enabled on this repo — skipping the homepage checks"
            echo "SKIP_PAGES=1" >> "$GITHUB_ENV"
            exit 0
          fi

          # the homepage is deliberately two doors and nothing else
          grep -qi "webdl" /tmp/index.html || { echo "::error::no webdl door on the homepage"; exit 1; }
          grep -qi "/links" /tmp/index.html || { echo "::error::no pages door on the homepage"; exit 1; }
          grep -q "tunnel.json" /tmp/index.html || { echo "::error::the homepage does not read tunnel.json"; exit 1; }

          # and the tunnel file it reads must be valid JSON
          code=$(curl -s -o /tmp/tunnel.json -w '%{http_code}' -m 30 "${SITE}tunnel.json" || echo ERR)
          echo "tunnel.json status: $code"
          if [ "$code" = "200" ]; then
            python3 -c "import json;d=json.load(open('/tmp/tunnel.json'));print('tunnel:',d.get('url'),'at',d.get('updated'))"
          else
            echo "::notice::no tunnel.json served yet — it appears on the first run after Pages is enabled"
          fi

      - name: Check the published tunnel state
        if: env.SKIP_PAGES != '1'
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY##*/}"
          curl -s -m 30 -o /tmp/state.json             "https://raw.githubusercontent.com/${OWNER}/${REPO}/main/tunnel.json" || true
          cat /tmp/state.json || true
          python3 - <<'PY'
          import json
          import sys
          try:
              state = json.load(open("/tmp/state.json"))
          except Exception as error:
              print(f"::error::tunnel.json unreadable: {error}")
              sys.exit(1)
          url = state.get("url", "")
          stamp = state.get("updated", "")
          if not (url.startswith("https://") and "trycloudflare.com" in url):
              print(f"::error::tunnel url looks wrong: {url!r}")
              sys.exit(1)
          if not stamp:
              print("::error::tunnel.json has no timestamp")
              sys.exit(1)
          # Staleness is information, not a failure: the file only refreshes
          # while the bot is running, and it is between runs by design.
          import datetime
          try:
              when = datetime.datetime.fromisoformat(stamp.replace("Z", "+00:00"))
              age_h = (datetime.datetime.now(datetime.timezone.utc) - when).total_seconds() / 3600
              if age_h > 6:
                  print(f"::notice::tunnel.json is {age_h:.1f}h old — it refreshes on the next run")
              else:
                  print(f"tunnel.json is {age_h:.1f}h old")
          except Exception:
              print("::notice::could not parse the timestamp; skipping the age check")
          print(f"state ok: {url} at {stamp}")
          open("/tmp/tunnel_url", "w").write(url)
          PY

      - name: Is the bot answering right now?
        if: env.SKIP_PAGES != '1'
        continue-on-error: true
        run: |
          URL=$(cat /tmp/tunnel_url)
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 25 "$URL/health" || echo 000)
          echo "GET $URL/health -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::tunnel not answering (normal between 5-hourly runs)"
          fi

  live:
    name: Live network probes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyrogram fastapi httpx yt-dlp[default,curl-cffi] mutagen

      - name: Live probes (Deezer, JioSaavn, Spotify, yt-dlp, real downloads)
        run: python amaterasu/scripts/test-live.py

      - name: Provider health summary
        if: always()
        run: |
          echo "### Live probe result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "See the 'Live probes' step above for the per-provider table." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
